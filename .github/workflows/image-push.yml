# pushing image to ecr
name: push image to ecr after all scans

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        image: [frontend, backend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Frontend
        if: matrix.image == 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.FRONTEND_ECR_REPO }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.FRONTEND_ECR_REPO }}:${{ github.sha }}

      - name: Build and Push Backend
        if: matrix.image == 'backend'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.BACKEND_ECR_REPO }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.BACKEND_ECR_REPO }}:${{ github.sha }}
