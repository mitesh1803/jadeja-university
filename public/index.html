<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meridian — Smart University Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="seal" aria-hidden="true">
      <svg viewBox="0 0 100 100" width="56" height="56">
        <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width="1"/>
        <text x="50" y="58" text-anchor="middle" font-family="Fraunces, serif" font-size="30" fill="currentColor">M</text>
      </svg>
    </div>
    <p class="eyebrow">Registrar's Office · Est. Demo Build</p>
    <h1>Meridian</h1>
    <p class="tagline">The record of everything you're studying, teaching, and tracking.</p>

    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@university.edu" required autocomplete="username" />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />

      <button type="submit">Sign in</button>
      <p id="login-error" class="error-text" role="alert"></p>
    </form>

    <div class="demo-accounts">
      <p class="demo-accounts__label">Demo accounts</p>
      <button type="button" class="chip" data-email="student1@university.edu" data-password="student123">Student · Amara Okafor</button>
      <button type="button" class="chip" data-email="faculty1@university.edu" data-password="faculty123">Faculty · Dr. Elena Cross</button>
      <button type="button" class="chip" data-email="admin@university.edu" data-password="admin123">Admin · Priya Nair</button>
    </div>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="app-shell" class="app-shell hidden">
  <aside class="rail">
    <div class="rail__brand">
      <div class="seal seal--small" aria-hidden="true">
        <svg viewBox="0 0 100 100" width="34" height="34">
          <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width="1"/>
          <text x="50" y="58" text-anchor="middle" font-family="Fraunces, serif" font-size="30" fill="currentColor">M</text>
        </svg>
      </div>
      <span>Meridian</span>
    </div>

    <nav class="rail__nav" id="rail-nav"></nav>

    <div class="rail__user">
      <div class="rail__user-info">
        <p id="user-name" class="rail__user-name"></p>
        <p id="user-role" class="rail__user-role"></p>
      </div>
      <button id="logout-btn" class="rail__logout" title="Sign out">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <header class="main__header">
      <div>
        <p id="view-eyebrow" class="eyebrow"></p>
        <h1 id="view-title"></h1>
      </div>
      <div id="view-actions" class="main__actions"></div>
    </header>

    <div id="banner" class="banner hidden"></div>

    <section id="view-root" class="view-root"></section>
  </main>
</div>

<!-- ============ MODAL ============ -->
<div id="modal-backdrop" class="modal-backdrop hidden">
  <div class="modal" id="modal">
    <button id="modal-close" class="modal__close" aria-label="Close">&times;</button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
