services:
  db:
    image: postgres:16-alpine
    container_name: jadeja-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meetesh
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: jadeja-project
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetesh -d jadeja-project"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: jadeja-backend
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${BACKEND_PORT:-4000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      NODE_ENV: production
    ports:
      - "${BACKEND_PORT:-4000}:4000"

  frontend:
    build:
      context: ./frontend
    container_name: jadeja-frontend
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  postgres_data:
